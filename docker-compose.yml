version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NOMBRE:-cal_db}
      POSTGRES_USER: ${DB_USUARIO:-cal_usuario}
      POSTGRES_PASSWORD: ${DB_CONTRASENA:-cal_contrasena}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USUARIO:-cal_usuario} -d ${DB_NOMBRE:-cal_db}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./cal/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NOMBRE: ${DB_NOMBRE:-cal_db}
      DB_USUARIO: ${DB_USUARIO:-cal_usuario}
      DB_CONTRASENA: ${DB_CONTRASENA:-cal_contrasena}
      JWT_SECRETO: ${JWT_SECRETO:-cambiar_en_produccion_secreto_largo_minimo_32_chars}
      JWT_EXPIRACION: ${JWT_EXPIRACION:-8h}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    volumes:
      - ./cal/backend/src:/app/src
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./cal/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_BACKEND_URL: http://backend:3000
    volumes:
      - ./cal/frontend/src:/app/src
    ports:
      - '5173:5173'
    depends_on:
      - backend

volumes:
  datos_postgres:
