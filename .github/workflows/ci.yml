name: CI

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend — lint y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cal/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cal/backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests unitarios con cobertura
        run: npm test -- --coverage --passWithNoTests

      - name: Tests e2e
        run: npm run test:e2e

  frontend:
    name: Frontend — lint y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cal/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cal/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test
